[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "convtts-slr"
version = "0.1.0"
description = "Agentic pipeline for the SLR on conversational datasets for controllable TTS"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "arxiv>=4.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pymupdf>=1.24",
  "rapidfuzz>=3",
  "typer>=0.12",
]
optional-dependencies.jev = [ "typesafe-sdk>=0.7,<1" ]
optional-dependencies.llm = [ "pydantic-ai-slim[anthropic]>=1" ]
optional-dependencies.acl = [ "acl-anthology>=1.3" ]
scripts.slr = "convtts_slr.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16.3",
  "ty>=0.0.73",
]

[tool.ruff]
# The Python version to use for compatibility checks.
target-version = "py314"
line-length = 100
exclude = [ "*.ipynb", ".agents", ".git", ".venv", "__pycache__", "venv" ]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.docstring-code-format = true
# A list of linting rules to enable.
# Here, we enable a standard set of rules.
lint.select = [
  # B-series: bugbear warnings
  "B",
  # C-series: complexity
  "C",
  # E-series: pycodestyle errors
  "E",
  # F-series: Pyflakes errors
  "F",
  # I-series: isort (auto-sort imports)
  "I",
  # N-series: naming conventions
  "N",
  # SIM: simplify
  "SIM",
  # T-series: typing errors
  "T",
  # W-series: pycodestyle warnings
  "W",
]

lint.ignore = [ "T201" ]

[tool.ty]
src.include = [ "src" ]
src.exclude = [ "notebooks/**", "tests/**", "*.ipynb" ]
environment.python = ".venv"
environment.python-version = "3.14"
rules.possibly-missing-attribute = "warn"
rules.unresolved-import = "error"
rules.unresolved-reference = "error"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
